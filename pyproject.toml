[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "process-risk-consequence-toolkit"
version = "0.1.0"
description = "Traceable consequence screening, optional dense-gas histories, and a restricted coupled-layer research model"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Ugwiyeon Lee"}]
keywords = ["process-safety", "consequence-analysis", "dense-gas", "risk", "research"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.14", "Topic :: Scientific/Engineering"]
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
http = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
coupled = ["numpy>=2,<3"]
dense = ["slabx==1.0.8"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=2,<3", "build>=1.2", "twine>=6"]

[project.urls]
Repository = "https://github.com/lyullee/process-risk-consequence-toolkit"
Documentation = "https://github.com/lyullee/process-risk-consequence-toolkit/blob/main/docs/MANUAL.md"
Issues = "https://github.com/lyullee/process-risk-consequence-toolkit/issues"

[project.scripts]
prct = "ccps_consequence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ccps_consequence*"]

[tool.setuptools.package-data]
ccps_consequence = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["dense_native: executes the optional pinned SLABx engine in a subprocess"]
