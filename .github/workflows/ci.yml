name: tests-and-package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,dense]'
      - run: python scripts/build_ccps_contracts.py && python scripts/build_manual.py
      - run: python -m pytest -q
      - run: python -m build && python -m twine check dist/*
      - run: python scripts/release_audit.py --dist
